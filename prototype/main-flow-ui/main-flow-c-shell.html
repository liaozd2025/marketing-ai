<!doctype html>
<!--
  PROTOTYPE — 选定范式 C「混合式」精修稿（丢弃品，勿作实现起点）
  视觉方向：按 JustAI 小加同学 的应用外壳（常驻左侧导航 + 极简白 + 黑色按钮 + 细线图标 + 紫色点缀）。
  · 新建内容 = JustAI「新对话」式 hero：大输入框 + 对话框内直接「选知识库内容」+ Skill 卡片
  · 提交后落地 C 混合式工作台：可发布汇总条 + 结果卡片 + 每条聊着改
  · 导航二库制：知识库（含素材）+ 内容库（成品归档）
  ?autogen=1 直达已生成状态。全静态假数据，无后端。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新建内容 · C 混合式精修稿（JustAI 外壳）</title>
<style>
  :root{
    --sidebar:#FFFFFF; --canvas:#FBFBFC; --surface:#FFFFFF;
    --ink:#18181B; --ink-2:#6E6E76; --ink-3:#A1A1AA;
    --line:#ECECEF; --line-2:#F4F4F5; --hover:#F5F5F6; --active:#F1F1F3;
    --accent:#6D5EF6; --accent-soft:#EFEDFD; --accent-ink:#5647E0;
    --btn:#18181B; --btn-hover:#000;
    --ok:#30A46C; --ok-soft:#E9F6EF; --warn:#E5484D; --warn-soft:#FDEBEC;
    --gold:#B58A34; --gold-soft:#F6EEDD;
    --r:12px; --r-lg:16px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:var(--canvas);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  button{font-family:inherit;cursor:pointer}
  #app{height:100%}
  .scroll{overflow:auto}
  .scroll::-webkit-scrollbar{width:9px;height:9px}
  .scroll::-webkit-scrollbar-thumb{background:#E4E4E7;border-radius:99px;border:2px solid var(--surface)}
  svg.i{width:17px;height:17px;flex:none;stroke:currentColor;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .tiny{font-size:12px}

  /* ---------------- shell ---------------- */
  .app{display:flex;height:100%}
  .sidebar{width:248px;flex:none;background:var(--sidebar);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:14px 12px}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
  .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#9C8BFF);
    display:flex;align-items:center;justify-content:center;color:#fff}
  .brand b{font-size:15px;letter-spacing:-.01em}
  .brand .sub{font-size:11px;color:var(--ink-3);font-weight:500}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--ink-2);
    font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer}
  .nav a:hover{background:var(--hover);color:var(--ink)}
  .nav a.on{background:var(--active);color:var(--ink);font-weight:600}
  .nav a .i{color:inherit}
  .nav a .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);background:var(--line-2);padding:1px 7px;border-radius:99px}
  .nav-sec{font-size:11px;color:var(--ink-3);font-weight:600;padding:16px 10px 7px;letter-spacing:.02em;
    display:flex;align-items:center}
  .nav-sec .more{margin-left:auto;color:var(--ink-3);font-weight:500;cursor:pointer}
  .nav-sec .more:hover{color:var(--ink)}
  .hist a{font-size:13px;color:var(--ink-2);padding:7px 10px;border-radius:8px;display:block;text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .hist a:hover{background:var(--hover);color:var(--ink)}
  .hist .end{font-size:11px;color:var(--ink-3);text-align:center;padding:10px}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;align-items:center;gap:10px}
  .tenant-av{width:30px;height:30px;border-radius:99px;flex:none;background:linear-gradient(135deg,#F0C9D8,#E7B3C6);
    display:flex;align-items:center;justify-content:center;color:#8A2F55;font-weight:700;font-size:12px}
  .side-foot .nm{font-size:13px;font-weight:600;line-height:1.2}
  .side-foot .plan{font-size:11px;color:var(--ink-3)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:54px;flex:none;display:flex;align-items:center;gap:12px;padding:0 26px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(6px)}
  .topbar .ttl{font-size:15px;font-weight:650}
  .topbar .path{color:var(--ink-3);font-weight:500}
  .grow{flex:1}
  .quota{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
    border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-weight:500}
  .quota .dia{color:var(--accent)}
  .up{color:var(--accent-ink);font-weight:600;font-size:13px;text-decoration:none;cursor:pointer}
  .me{width:30px;height:30px;border-radius:99px;background:#C7C7CE}

  .content{flex:1;padding:26px 32px 90px;width:100%}
  .content.center{max-width:760px;margin:0 auto}
  .content.wide{max-width:900px;margin:0 auto}

  /* ---------------- atoms ---------------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;transition:.14s}
  .btn:hover{background:var(--hover)}
  .btn.dark{background:var(--btn);border-color:var(--btn);color:#fff}.btn.dark:hover{background:var(--btn-hover)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;
    background:var(--surface);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:.14s}
  .chip:hover{border-color:#D9D9DE;color:var(--ink)} .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.mut{background:var(--line-2);color:var(--ink-2)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .tag.persona{background:#EEE9FB;color:#6A4BA6}.tag.seed{background:#E6EFF7;color:#2E6E9E}.tag.camp{background:var(--gold-soft);color:var(--gold)}
  mark.ban{background:var(--warn-soft);color:var(--warn);padding:0 2px;border-radius:3px;font-weight:600;
    text-decoration:underline wavy var(--warn);text-underline-offset:3px}
  .src{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);background:var(--line-2);padding:2px 9px;border-radius:6px}
  .link{background:none;border:none;color:var(--ink-2);font-weight:600;font-size:13px;padding:5px 7px;border-radius:7px;
    display:inline-flex;align-items:center;gap:6px}.link:hover{background:var(--hover);color:var(--ink)}

  /* ---------------- HERO (新对话式) ---------------- */
  .hero{padding-top:7vh}
  .greet{text-align:center;margin-bottom:26px}
  .greet h1{font-size:30px;font-weight:750;letter-spacing:-.02em;margin:0 0 8px}
  .greet p{color:var(--ink-2);font-size:15px;margin:0}
  .composer{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 4px 24px rgba(24,24,27,.05);padding:14px 16px}
  .composer:focus-within{border-color:#D9D9DE;box-shadow:0 6px 30px rgba(24,24,27,.08)}
  .sel-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .sel-lbl{font-size:12px;color:var(--ink-3);font-weight:500}
  .kb-chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid #E1DCFB;
    color:var(--accent-ink);border-radius:99px;padding:4px 6px 4px 10px;font-size:12.5px;font-weight:500}
  .kb-chip .x{width:15px;height:15px;border-radius:99px;background:#E1DCFB;color:var(--accent-ink);border:none;
    font-size:10px;display:flex;align-items:center;justify-content:center}
  .kb-chip .x:hover{background:#D3CBF7}
  .composer textarea{width:100%;border:none;outline:none;resize:none;font-family:inherit;font-size:15px;
    line-height:1.6;min-height:52px;background:transparent;color:var(--ink)}
  .composer textarea::placeholder{color:var(--ink-3)}
  .cbar{display:flex;align-items:center;gap:8px;margin-top:8px}
  .cbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-2);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:500}
  .cbtn:hover{background:var(--hover);color:var(--ink)} .cbtn.act{border-color:#D9D9DE;color:var(--ink)}
  .cbtn .i{width:15px;height:15px}
  .send{width:38px;height:38px;border-radius:99px;background:var(--btn);color:#fff;border:none;flex:none;
    display:flex;align-items:center;justify-content:center}.send:hover{background:#000}
  .mic{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    display:flex;align-items:center;justify-content:center}.mic:hover{background:var(--hover)}
  /* KB picker popover */
  .picker{position:absolute;left:16px;top:calc(100% + 8px);width:340px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 12px 40px rgba(24,24,27,.16);padding:8px;z-index:20}
  .picker .ph{font-size:11px;color:var(--ink-3);font-weight:600;padding:6px 8px}
  .picker .opt{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:9px;cursor:pointer}
  .picker .opt:hover{background:var(--hover)}
  .picker .opt .emj{font-size:16px;width:20px;text-align:center}
  .picker .opt .nm{font-size:13px;font-weight:600}.picker .opt .dt{font-size:11px;color:var(--ink-3)}
  .picker .opt .ck{margin-left:auto;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff}
  .picker .opt.on .ck{background:var(--accent);border-color:var(--accent)}

  .skill-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
  .scard{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;background:var(--surface);cursor:pointer;transition:.14s}
  .scard:hover{border-color:#D9D9DE;box-shadow:0 4px 16px rgba(24,24,27,.05)}
  .scard.on{border-color:var(--accent);background:#FCFBFF}
  .scard .emj{width:38px;height:38px;border-radius:11px;background:var(--line-2);display:flex;align-items:center;
    justify-content:center;font-size:19px;flex:none}
  .scard b{font-size:14px}.scard .d{font-size:12px;color:var(--ink-2);margin-top:2px}

  .recent-head{display:flex;align-items:center;margin:26px 0 12px}
  .recent-head b{font-size:14px}.recent-head .link{margin-left:auto}
  .recent{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .rcard{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);cursor:pointer}
  .rcard:hover{background:var(--hover)}
  .rcard .rt{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4}
  .rcard .rm{display:flex;align-items:center;gap:7px}

  /* ---------------- RESULTS (C 混合式) ---------------- */
  .res-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .ctx-read{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .summary{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:11px 15px;margin-bottom:14px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
  .post.blocked{border-color:#F3CFD1}
  .post .head{display:flex;align-items:center;gap:8px}.post .head .st{margin-left:auto}
  .post .body{font-size:14px;line-height:1.72;white-space:pre-wrap}
  .lint{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid #F3CFD1;border-radius:10px;
    padding:9px 12px;font-size:12.5px;color:#B02A2E}.lint b{color:var(--warn)}
  .imgs{display:flex;gap:8px;flex-wrap:wrap}
  .thumb{width:72px;height:72px;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;
    display:flex;align-items:flex-end;background:linear-gradient(135deg,#F1F1F3,#E9E9EC)}
  .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.55}
  .thumb .lbl{position:relative;font-size:9px;line-height:1.2;padding:3px 4px;background:rgba(255,255,255,.9);width:100%;color:var(--ink-2);font-weight:500}
  .thumb.real::after{content:"实拍";position:absolute;top:4px;right:4px;background:var(--ok);color:#fff;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700}
  .thumb.tpl::after{content:"合成";position:absolute;top:4px;right:4px;background:var(--gold);color:#fff;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700}
  .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
  .refine{border-top:1px dashed var(--line);padding-top:12px}
  .refine .row{display:flex;gap:8px}
  .refine input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 13px;outline:none;font-family:inherit;font-size:13px}
  .refine input:focus{border-color:var(--accent)}
  .refine .rq{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .refine .rq button{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
  .refine .rq button:hover{border-color:#D9D9DE;color:var(--ink)}
  .shimmer{position:relative;overflow:hidden;background:var(--line-2);border-radius:14px}
  .shimmer::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sh 1.1s infinite}
  @keyframes sh{100%{transform:translateX(100%)}}
  .proto-flag{position:fixed;right:14px;bottom:14px;font-size:11px;color:var(--ink-3);background:var(--surface);
    border:1px dashed var(--line);border-radius:99px;padding:5px 11px;z-index:9}

  /* ---------------- 我的资料 ---------------- */
  .zhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .zhead h2{font-size:20px;font-weight:700;margin:0}
  .zhead .grow{flex:1}
  .zbanner{display:flex;gap:14px;align-items:flex-start;background:var(--line-2);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;margin-bottom:20px}
  .zbanner .ic{width:40px;height:40px;border-radius:11px;background:var(--btn);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center}
  .zbanner b{font-size:14.5px}.zbanner p{margin:4px 0 0;color:var(--ink-2);font-size:13px;line-height:1.6}
  .zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .zcard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;cursor:pointer;
    transition:.14s;display:flex;flex-direction:column;gap:10px;min-height:132px}
  .zcard:hover{border-color:#D9D9DE;box-shadow:0 6px 20px rgba(24,24,27,.06)}
  .zcard .top{display:flex;align-items:center;gap:10px}
  .zcard .fico{width:34px;height:34px;border-radius:10px;background:var(--line-2);display:flex;align-items:center;
    justify-content:center;font-size:17px}
  .zcard b{font-size:14.5px}.zcard .ct{margin-left:auto;font-size:12px;color:var(--ink-3)}
  .zcard .dt{font-size:12px;color:var(--ink-2)}
  .zcard .barwrap{margin-top:auto;display:flex;align-items:center;gap:8px}
  .zcard .bar{flex:1;height:5px;border-radius:99px;background:var(--line-2);overflow:hidden}
  .zcard .bar i{display:block;height:100%;background:var(--ok)}.zcard .bar i.w{background:var(--gold)}
  .zcard .pct{font-size:11px;font-weight:700;color:var(--ink-2)}
  /* detail */
  .zdtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .zdtop .nm{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
  .zdtop .sub{font-size:12px;color:var(--ink-3)}
  .uploads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  .dz{border:1.5px dashed var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;
    align-items:center;gap:8px;text-align:center;background:var(--surface)}
  .dz .big{width:40px;height:40px;color:var(--ink-3)}
  .dz b{font-size:14px}.dz .h{font-size:12px;color:var(--ink-2)}
  .dz .h2{font-size:11px;color:var(--ink-3)}
  .lz{border:1.5px dashed var(--line);border-radius:14px;padding:22px;background:var(--surface)}
  .lz .lh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .lz .sub{font-size:11px;color:var(--ink-3);margin:4px 0 12px}
  .lz textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    outline:none;font-family:inherit;font-size:13px;resize:none}.lz textarea:focus{border-color:var(--accent)}
  .extracted{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
  .extracted .eh{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .extracted .eh b{font-size:14px}
  .frow{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .frow:last-child{border-bottom:none}
  .frow .fk{width:96px;flex:none;font-size:13px;color:var(--ink-2);font-weight:600}
  .frow .fv{font-size:13.5px;line-height:1.6}
  .olist{display:flex;flex-direction:column;gap:10px}
  .orow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .orow .oemj{width:34px;height:34px;border-radius:9px;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-size:16px}
  .orow b{font-size:13.5px}.orow .os{font-size:12px;color:var(--ink-2)}
  .imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .ithumb{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);position:relative;overflow:hidden;
    display:flex;align-items:flex-end;background:linear-gradient(135deg,#F1F1F3,#E9E9EC)}
  .ithumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.5}
  .ithumb .lbl{position:relative;font-size:9px;padding:3px 4px;background:rgba(255,255,255,.9);width:100%;color:var(--ink-2);font-weight:500}
  .ithumb.real::after{content:"实拍";position:absolute;top:4px;right:4px;background:var(--ok);color:#fff;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700}
  .note{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid #E1DCFB;color:var(--accent-ink);
    border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:14px}

  @media(max-width:920px){.sidebar{display:none}.skill-cards,.recent,.uploads{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="proto-flag">◇ 原型 · 代码即弃</div>
<script>
/* ---------------- 图标 ---------------- */
const I={
  compose:'<svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',

    <div class="refine"><div class="row"><input placeholder="聊着改这一条…例如「开头更抓人一点」" data-rin="${p.id}">

  setTimeout(()=>{S.stage="done";render();},850);}
function wire(){
  document.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.nav;
    if(k==="new"){S.view="hero";render();}
    else if(k==="kb"){S.view="ziliao";render();}
  });
  if(S.view==="ziliao"){
    document.querySelectorAll("[data-zopen]").forEach(el=>el.onclick=()=>{S.detailKey=el.dataset.zopen;S.view="ziliao-detail";render();});
    return;
  }
  if(S.view==="ziliao-detail"){
    document.getElementById("zback").onclick=()=>{S.view="ziliao";render();};
    return;
  }
  if(S.view==="hero"){
    const dr=document.getElementById("draft");
    if(dr){dr.addEventListener("input",e=>S.draft=e.target.value);
      dr.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();generate();}});}
    document.getElementById("send").onclick=generate;
    document.querySelectorAll("[data-openpicker]").forEach(el=>el.onclick=e=>{e.stopPropagation();S.pickerOpen=!S.pickerOpen;render();});
    document.querySelectorAll("[data-tog]").forEach(el=>el.onclick=e=>{e.stopPropagation();const k=el.dataset.tog;
      S.sel=S.sel.includes(k)?S.sel.filter(x=>x!==k):[...S.sel,k];render();});
    document.querySelectorAll("[data-unsel]").forEach(el=>el.onclick=()=>{S.sel=S.sel.filter(x=>x!==el.dataset.unsel);render();});
    document.querySelectorAll("[data-skill]").forEach(el=>el.onclick=()=>{S.skill=el.dataset.skill;S.pickerOpen=false;render();
      const t=document.getElementById("draft");if(t)t.focus();});
    if(S.pickerOpen) setTimeout(()=>document.addEventListener("click",closePicker),0);
  } else {
    document.getElementById("back").onclick=()=>{S.view="hero";S.stage="idle";render();};
    document.querySelectorAll("[data-rw]").forEach(el=>el.onclick=()=>{const p=S.posts.find(x=>x.id===el.dataset.rw);
      if(p){p.body=p.compliant;p.banned=[];p.sources=p.sources.filter(s=>!s.includes("违禁词"));}render();});
    document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=()=>{const o=el.innerHTML;el.innerHTML=`${I.check} 已复制`;setTimeout(()=>el.innerHTML=o,1200);});
    document.querySelectorAll("[data-imgs]").forEach(el=>el.onclick=()=>{el.innerHTML=`${I.check} 已换一批`;setTimeout(()=>render(),650);});
    const refine=id=>{const c=document.querySelector(`[data-card="${id}"]`);if(c)c.style.opacity=".5";
      setTimeout(()=>{render();const e=document.querySelector(`[data-card="${id}"]`);if(e)e.scrollIntoView({block:"center",behavior:"smooth"});},650);};
    document.querySelectorAll("[data-rsend]").forEach(el=>el.onclick=()=>refine(el.dataset.rsend));
    document.querySelectorAll("[data-rq]").forEach(el=>el.onclick=()=>refine(el.dataset.rq));
    document.querySelectorAll("[data-rin]").forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter")refine(el.dataset.rin);}));
  }
}
function closePicker(e){const p=document.getElementById("picker");
  if(p&&!p.contains(e.target)&&!e.target.closest("[data-openpicker]")){S.pickerOpen=false;document.removeEventListener("click",closePicker);render();}}

render();
if(new URLSearchParams(location.search).get("autogen")==="1"){S.view="results";S.posts=seedPosts();S.stage="done";render();}
</script>
</body>
</html>
