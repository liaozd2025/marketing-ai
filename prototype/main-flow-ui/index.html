<!doctype html>
<!--
  PROTOTYPE — 主流程界面对比稿（丢弃品，勿作实现起点）
  问题：商家从进入平台到拿到一条「可发布」内容的主流程界面应该长什么样？
  三个变体（?variant=A|B|C，底部浮动条 / ← → 键盘切换）：
    A 对话式 · B 工作台式 · C 混合式
  全静态假数据，无后端。虚构商家「悦见美学」。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主流程界面对比稿 · marketing-ai 原型</title>
<style>
  :root{
    --bg:#F7F3F1; --surface:#FFFFFF; --surface-2:#FBF7F6; --line:#EBE2DE;
    --ink:#2B2530; --ink-2:#6B6069; --ink-3:#9A8F97;
    --brand:#9E4770; --brand-soft:#F3E4EC; --brand-ink:#7A3255;
    --gold:#C39A5A; --gold-soft:#F6EEDF;
    --ok:#2F9E6E; --ok-soft:#E4F3EC;
    --warn:#D6474B; --warn-soft:#FBE6E6;
    --radius:14px; --shadow:0 1px 2px rgba(43,37,48,.04),0 8px 24px rgba(43,37,48,.06);
    --shadow-sm:0 1px 2px rgba(43,37,48,.05);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
  #app{height:100%}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:var(--brand-soft)}

  /* ---------- shared atoms ---------- */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);
    box-shadow:var(--shadow-sm);transition:.15s}
  .chip:hover{border-color:var(--brand);color:var(--brand-ink)}
  .chip.solid{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip.ghost{background:transparent;box-shadow:none;border-style:dashed;color:var(--ink-3)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;
    border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);transition:.15s}
  .btn:hover{border-color:var(--brand);color:var(--brand-ink)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:var(--brand-ink)}
  .btn.big{padding:13px 22px;font-size:15px;border-radius:12px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;
    font-size:12px;font-weight:600}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.gold{background:var(--gold-soft);color:#8C6A2B}
  .badge.brand{background:var(--brand-soft);color:var(--brand-ink)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .tag.persona{background:#EDE7F6;color:#6A4BA6}
  .tag.seed{background:#E6F0F7;color:#2E6E9E}
  .tag.camp{background:var(--gold-soft);color:#8C6A2B}
  mark.ban{background:var(--warn-soft);color:var(--warn);padding:0 2px;border-radius:3px;
    font-weight:600;text-decoration:underline wavy var(--warn);text-underline-offset:3px}
  .muted{color:var(--ink-2)}
  .tiny{font-size:12px}
  .icon{width:15px;height:15px;flex:none}
  .src-chips{display:flex;flex-wrap:wrap;gap:5px}
  .src{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--brand-ink);
    background:var(--brand-soft);padding:2px 8px;border-radius:6px}
  .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .thumb{width:74px;height:74px;border-radius:10px;border:1px solid var(--line);position:relative;
    overflow:hidden;display:flex;align-items:flex-end;background:linear-gradient(135deg,#efe6e9,#e7dde2)}
  .thumb .lbl{font-size:9px;line-height:1.2;padding:3px 4px;background:rgba(255,255,255,.86);
    width:100%;color:var(--ink-2);font-weight:500}
  .thumb.real::after{content:"实拍";position:absolute;top:4px;right:4px;background:var(--ok);
    color:#fff;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700}
  .thumb.tpl::after{content:"合成";position:absolute;top:4px;right:4px;background:var(--gold);
    color:#fff;font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700}
  .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:22px;opacity:.5}

  /* content card (shared skeleton, styled slightly per host) */
  .post{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:11px}
  .post.blocked{border-color:#F0C6C7}
  .post-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .post-body{font-size:14px;line-height:1.7;white-space:pre-wrap}
  .post-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border-top:1px dashed var(--line);padding-top:11px}
  .lint{display:flex;align-items:center;gap:8px;background:var(--warn-soft);border:1px solid #F0C6C7;
    border-radius:10px;padding:8px 11px;font-size:12.5px;color:#9A2E31}
  .lint b{color:var(--warn)}
  .link-btn{background:none;border:none;color:var(--brand-ink);font-weight:600;font-size:13px;
    padding:4px 6px;border-radius:6px}
  .link-btn:hover{background:var(--brand-soft)}
  .field-lbl{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:block}

  /* ---------- floating switcher ---------- */
  #switch{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;
    display:flex;align-items:center;gap:2px;background:#2B2530;color:#fff;border-radius:999px;
    padding:5px;box-shadow:0 10px 30px rgba(43,37,48,.35)}
  #switch .arw{width:34px;height:34px;border-radius:999px;border:none;background:transparent;color:#fff;
    font-size:16px;display:flex;align-items:center;justify-content:center}
  #switch .arw:hover{background:rgba(255,255,255,.14)}
  #switch .lbl{padding:0 12px;font-size:13px;font-weight:600;white-space:nowrap;min-width:132px;text-align:center}
  #switch .lbl small{display:block;font-size:10px;font-weight:500;color:#C9B8C4;letter-spacing:.06em}
  #switch .dots{display:flex;gap:4px;padding:0 8px 0 4px}
  #switch .dot{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.3);border:none;padding:0}
  #switch .dot.on{background:var(--gold)}
  #proto-tag{position:fixed;left:14px;bottom:18px;z-index:99;font-size:11px;color:var(--ink-3);
    background:var(--surface);border:1px dashed var(--line);border-radius:999px;padding:5px 11px;
    display:flex;align-items:center;gap:6px}

  /* ---------- app frame ---------- */
  .frame{height:100%;display:flex;flex-direction:column}
  .topbar{height:52px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 18px}
  .brandmark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--gold));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
  .topbar .name{font-weight:700}
  .topbar .grow{flex:1}
  .avatar{width:28px;height:28px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
  .scroll{overflow:auto}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:#E0D6D2;border-radius:99px;border:3px solid var(--bg)}

  /* shimmer */
  .shimmer{position:relative;overflow:hidden;background:var(--surface-2);border-radius:10px}
  .shimmer::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
    animation:sh 1.1s infinite}
  @keyframes sh{100%{transform:translateX(100%)}}
  .typing{display:inline-flex;gap:4px;align-items:center}
  .typing i{width:6px;height:6px;border-radius:99px;background:var(--ink-3);animation:tp 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* =========================================================
     VARIANT A — 对话式
     ========================================================= */
  .v-a .chat{max-width:760px;margin:0 auto;padding:24px 18px 150px;display:flex;flex-direction:column;gap:18px}
  .v-a .kbhint{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px}
  .msg{display:flex;gap:12px;align-items:flex-start}
  .msg .who{width:30px;height:30px;border-radius:999px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:14px}
  .msg.a .who{background:linear-gradient(135deg,var(--brand),var(--gold));color:#fff}
  .msg.u{flex-direction:row-reverse}
  .msg.u .who{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
  .bubble{max-width:82%;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:12px 15px;box-shadow:var(--shadow-sm)}
  .msg.u .bubble{background:var(--brand);color:#fff;border-color:var(--brand)}
  .msg.a .bubble{border-top-left-radius:5px}
  .msg.u .bubble{border-top-right-radius:5px}
  .bubble .cards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .composer{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);width:min(760px,92vw);
    background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:10px 10px 10px 16px}
  .composer .row{display:flex;align-items:center;gap:10px}
  .composer input{flex:1;border:none;outline:none;font-size:14.5px;background:transparent;font-family:inherit}
  .composer .send{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff;border:none;
    display:flex;align-items:center;justify-content:center;flex:none}
  .composer .send:hover{background:var(--brand-ink)}
  .composer .quick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .v-a .post{box-shadow:none}

  /* =========================================================
     VARIANT B — 工作台式
     ========================================================= */
  .v-b .body{display:flex;height:100%;min-height:0}
  .v-b .side{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--line);
    padding:18px 14px;overflow:auto}
  .v-b .side h3{margin:0 0 4px;font-size:13px;color:var(--ink-2);text-transform:none;letter-spacing:.02em}
  .kb-ring{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:16px}
  .ring{width:46px;height:46px;border-radius:999px;flex:none;
    background:conic-gradient(var(--brand) 0 92%,#EADFE4 92% 100%);display:flex;align-items:center;justify-content:center}
  .ring i{width:36px;height:36px;border-radius:999px;background:var(--surface);display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:800;color:var(--brand-ink);font-style:normal}
  .kb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
  .kb-item:hover{background:var(--surface-2)}
  .kb-item .ei{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:14px}
  .kb-item .nm{flex:1}
  .kb-item .nm b{display:block;font-size:13px}
  .kb-item .nm span{font-size:11px;color:var(--ink-3)}
  .kb-item .mini{width:48px;height:5px;border-radius:99px;background:#EDE4E8;overflow:hidden;flex:none}
  .kb-item .mini i{display:block;height:100%;background:var(--ok)}
  .v-b .main{flex:1;min-width:0;overflow:auto;padding:22px 26px 120px}
  .step{margin-bottom:22px}
  .step-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .step-h .no{width:22px;height:22px;border-radius:999px;background:var(--brand);color:#fff;font-size:12px;
    font-weight:800;display:flex;align-items:center;justify-content:center}
  .step-h b{font-size:15px}
  .skill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .skill-card{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);
    transition:.15s;position:relative}
  .skill-card:hover{border-color:var(--brand)}
  .skill-card.on{border-color:var(--brand);background:var(--brand-soft)}
  .skill-card .emj{font-size:20px}
  .skill-card b{display:block;margin-top:8px;font-size:14px}
  .skill-card span{font-size:11.5px;color:var(--ink-2)}
  .skill-card.on::after{content:"✓";position:absolute;top:10px;right:12px;color:var(--brand);font-weight:800}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:18px}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .seg button.on{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shadow-sm)}
  .checks{display:flex;gap:8px;flex-wrap:wrap}
  .check{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .check.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{border:none;background:var(--surface-2);width:34px;height:34px;font-size:16px;color:var(--ink-2)}
  .stepper b{width:44px;text-align:center;font-size:15px}
  select.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
    font-family:inherit;font-size:13.5px;color:var(--ink)}
  .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .gen-summary{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:14px}

  /* =========================================================
     VARIANT C — 混合式
     ========================================================= */
  .v-c .wrap{max-width:820px;margin:0 auto;padding:22px 18px 150px}
  .ctxbar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    box-shadow:var(--shadow-sm);margin-bottom:16px}
  .ctxbar .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .ctxbar .ctx-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .ctx-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px}
  .ctx-chip .ex{width:16px;height:16px;border-radius:999px;background:#EADFE4;color:var(--ink-2);border:none;
    font-size:11px;display:flex;align-items:center;justify-content:center}
  .ctx-chip .dot{width:7px;height:7px;border-radius:99px;background:var(--ok)}
  .preset-row{display:flex;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}
  .gen-hero{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--brand-soft),var(--gold-soft));
    border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:18px}
  .gen-hero .t{flex:1}
  .gen-hero .t b{font-size:15px}
  .gen-hero .t span{font-size:12.5px;color:var(--ink-2)}
  .v-c .stack{display:flex;flex-direction:column;gap:14px}
  .refine{border-top:1px dashed var(--line);padding-top:11px;margin-top:1px}
  .refine .rrow{display:flex;gap:8px;align-items:center}
  .refine input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none;
    font-family:inherit;font-size:13px}
  .refine input:focus{border-color:var(--brand)}
  .refine .rq{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .refine .rq button{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-2)}
  .refine .rq button:hover{border-color:var(--brand);color:var(--brand-ink)}
  .refine-open .refine{background:var(--surface-2);margin:-2px -16px -16px;padding:14px 16px 16px;border-radius:0 0 14px 14px}

  .empty{color:var(--ink-3);text-align:center;padding:30px;font-size:13px}
  @media(max-width:820px){
    .skill-grid{grid-template-columns:repeat(2,1fr)}
    .results-grid,.form-grid{grid-template-columns:1fr}
    .v-b .side{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="proto-tag">◇ 原型对比稿 · 代码即弃</div>
<div id="switch"></div>

<script>

/* icons */
const IC = {
  copy:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  send:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
  img:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>',
  check:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>',
  warn:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6A2 2 0 0 0 22 18L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  wand:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 21 12-12M15 9l3-3-3-3M18 6h3M6 3l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>',
};

/* highlight banned words */
function hl(body,banned){
  let h = body.replace(/</g,"&lt;").replace(/\n/g,"<br>");
  banned.forEach(w=>{ h = h.replaceAll(w, `<mark class="ban">${w}</mark>`); });
  return h;
}
function statusBadge(p){
  return p.banned.length
    ? `<span class="badge warn">${IC.warn} 不可发布 · ${p.banned.length} 处违规</span>`
    : `<span class="badge ok">${IC.check} 可发布</span>`;
}
function tagClass(t){return t==="persona"?"persona":t==="seed"?"seed":"camp";}

/* a full content card, reused by all 3 variants. opts.refine adds C's 聊着改 footer */
function postCard(p, opts={}){
  const lint = p.banned.length ? `
    <div class="lint">${IC.warn}<div>命中违禁词 <b>${p.banned.join("、")}</b>（美业·疗效承诺类）。已阻止「可发布」。</div>
      <button class="btn primary" style="margin-left:auto;padding:6px 12px" data-rewrite="${p.id}">${IC.wand} 一键合规改写</button></div>` : "";
  const imgs = p.imgs.map(im=>`
    <div class="thumb ${im.real?'real':im.tpl?'tpl':''}"><div class="ph">${im.emj}</div><div class="lbl">${im.lbl}</div></div>`).join("");
  const refine = opts.refine ? `
    <div class="refine">
      <div class="rrow">
        <input placeholder="聊着改这一条…例如「开头更抓人一点」" data-refine-input="${p.id}">
        <button class="btn primary" style="padding:8px 14px" data-refine-send="${p.id}">${IC.send}</button>
      </div>
      <div class="rq">
        <button data-rq="${p.id}|更口语">更口语</button>
        <button data-rq="${p.id}|更简短">更简短</button>
        <button data-rq="${p.id}|换个开头">换个开头</button>
        <button data-rq="${p.id}|加点 emoji">加点 emoji</button>
      </div>
    </div>` : "";
  return `
  <div class="post ${p.banned.length?'blocked':''}" data-card="${p.id}">
    <div class="post-head">
      <span class="tag ${tagClass(p.type)}">${p.typeLabel}朋友圈</span>
      ${statusBadge(p)}
    </div>
    <div class="post-body">${hl(p.body,p.banned)}</div>
    ${lint}
    <div class="src-chips">${p.sources.map(s=>`<span class="src">📎 ${s}</span>`).join("")}</div>
    <div>
      <div class="tiny muted" style="margin-bottom:6px">配图建议（点标签调素材）</div>
      <div class="imgs">${imgs}</div>
    </div>
    <div class="post-foot">
      <button class="link-btn" data-copy="${p.id}">${IC.copy} 复制文案</button>
      <button class="link-btn" data-imgs="${p.id}">${IC.img} 换配图</button>
      ${p.banned.length?'':'<span class="badge brand" style="margin-left:auto">✓ 已过校验，可复制发布</span>'}
    </div>
    ${refine}
  </div>`;
}

/* =========================================================
   状态
   ========================================================= */
const S = {
  variant: (new URLSearchParams(location.search).get("variant")||"A").toUpperCase(),
  a:{ stage:"idle", posts:null, log:[] },   // idle | typing | done
  b:{ skill:"pyq", types:{persona:true,seed:true,camp:true}, count:3, stage:"idle", posts:null },
  c:{ stage:"idle", posts:null, openRefine:null },
};
if(!["A","B","C"].includes(S.variant)) S.variant="A";

const VARIANTS = [
  {k:"A", name:"对话式", desc:"跟智能体聊天出内容"},
  {k:"B", name:"工作台式", desc:"结构化仪表盘生成"},
  {k:"C", name:"混合式", desc:"工作台 + 聊着改"},
];

/* =========================================================
   顶栏（共享）
   ========================================================= */
function topbar(right=""){
  return `<div class="topbar">
    <div class="brandmark">悦</div>
    <div class="name">${MERCHANT}</div>
    <span class="pill">🌙 七夕焕肤季 进行中</span>
    <div class="grow"></div>
    ${right}
    <div class="avatar">悦</div>
  </div>`;
}

/* =========================================================
   VARIANT A — 对话式
   ========================================================= */
function renderA(){
  const a=S.a;
  const kbRight = `<span class="pill">🗂️ 知识库已就绪 · 6 类资料</span>`;
  let thread = `
    <div class="msg a"><div class="who">悦</div><div class="bubble">
      你好呀，我是阿悦的内容助手 ☺️<br>今天想发点什么？我会参考你的品牌档案、在做的活动和实拍素材来写。
      <div class="kbhint" style="justify-content:flex-start;margin-top:10px">
        <span class="chip" data-a-quick="今日朋友圈日更，来 3 条">✨ 今日朋友圈 ×3</span>
        <span class="chip" data-a-quick="帮我种草水光焕肤">💧 种草某个项目</span>
        <span class="chip" data-a-quick="七夕活动预热文案">🎁 七夕活动预热</span>
      </div>
    </div></div>`;

  a.log.forEach(m=>{
    if(m.role==="u") thread += `<div class="msg u"><div class="who">悦</div><div class="bubble">${m.text}</div></div>`;
    else thread += `<div class="msg a"><div class="who">悦</div><div class="bubble">${m.text}${m.cards?`<div class="cards">${m.cards.map(p=>postCard(p)).join("")}</div>`:""}</div></div>`;
  });

  if(a.stage==="typing"){
    thread += `<div class="msg a"><div class="who">悦</div><div class="bubble">
      正在翻你的资料库… <span class="typing"><i></i><i></i><i></i></span>
      <div class="src-chips" style="margin-top:9px">
        <span class="src">📎 品牌档案·阿悦人设</span><span class="src">📎 七夕焕肤季</span>
        <span class="src">📎 深层清洁护理</span><span class="src">📎 素材·38 张实拍</span></div>
    </div></div>`;
  }

  const followups = a.stage==="done" ? `
    <div class="quick">
      <span class="chip" data-a-quick="第 2 条太夸张了，帮我改保守合规一点">第 2 条改保守点</span>
      <span class="chip" data-a-quick="再来 2 条不同角度的">再来 2 条</span>
      <span class="chip" data-a-quick="活动那条加上限时紧迫感">活动条加点紧迫感</span>
    </div>` : "";

  document.getElementById("app").innerHTML = `
    <div class="frame v-a">
      ${topbar(kbRight)}
      <div class="scroll" style="flex:1"><div class="chat">${thread}</div></div>
      <div class="composer">
        ${followups}
        <div class="row">
          <input id="a-input" placeholder="像发消息一样告诉我想发什么…（知识库在幕后自动参考）">
          <button class="send" id="a-send">${IC.send}</button>
        </div>
      </div>
    </div>`;

  const sc=document.querySelector(".v-a .scroll"); if(sc) sc.scrollTop=sc.scrollHeight;
  document.querySelectorAll("[data-a-quick]").forEach(el=>el.onclick=()=>aSend(el.dataset.aQuick));
  document.getElementById("a-send").onclick=()=>{const v=document.getElementById("a-input").value.trim(); if(v) aSend(v);};
  document.getElementById("a-input").addEventListener("keydown",e=>{if(e.key==="Enter"){const v=e.target.value.trim(); if(v) aSend(v);}});
  wireCards();
}
function aSend(text){
  const a=S.a;
  a.log.push({role:"u",text});
  a.stage="typing"; renderA();
  setTimeout(()=>{
    const first = a.posts===null;
    if(first){
      a.posts=seedPosts();
      a.log.push({role:"a",text:"好啦～按你的人设和七夕活动写了 3 条，配图我也从素材库挑好了。第 2 条我标了违规词，先别发：",cards:a.posts});
    }else{
      // refine: just acknowledge + re-show current cards
      a.log.push({role:"a",text:"改好了，你看看这版：",cards:a.posts.map(p=>p)});
    }
    a.stage="done"; renderA();
  },1100);
}

/* =========================================================
   VARIANT B — 工作台式
   ========================================================= */
const SKILLS=[
  {k:"pyq",emj:"📱",n:"朋友圈日更",d:"人设/种草/活动"},
  {k:"vip",emj:"💌",n:"会员触达",d:"分层×场景话术"},
  {k:"grp",emj:"👯",n:"社群运营",d:"群公告/预热"},
  {k:"xhs",emj:"📕",n:"小红书图文",d:"标题+正文+封面"},
];
function renderB(){
  const b=S.b;
  const side = `
    <div class="side scroll">
      <div class="kb-ring"><div class="ring"><i>92%</i></div>
        <div><b style="font-size:13px">知识库完善度</b><div class="tiny muted">越完整，内容越像你</div></div></div>
      <h3>知识库实体</h3>
      ${KB.map(e=>`<div class="kb-item">
        <div class="ei">${e.emj}</div>
        <div class="nm"><b>${e.name}</b><span>${e.sub}</span></div>
        <div class="mini"><i style="width:${e.fill}%"></i></div></div>`).join("")}
    </div>`;

  const skillGrid = SKILLS.map(s=>`
    <div class="skill-card ${b.skill===s.k?'on':''}" data-skill="${s.k}">
      <div class="emj">${s.emj}</div><b>${s.n}</b><span>${s.d}</span></div>`).join("");

  const typeCheck = (k,l)=>`<div class="check ${b.types[k]?'on':''}" data-type="${k}">${b.types[k]?IC.check:''} ${l}</div>`;

  let results = `<div class="empty">配置好参数后点「生成内容」，结果会出现在这里 ↑</div>`;
  if(b.stage==="loading"){
    results = `<div class="results-grid">${[0,1,2,3].map(()=>`<div class="shimmer" style="height:210px"></div>`).join("")}</div>`;
  }else if(b.stage==="done"){
    const shown=b.posts.filter(p=>b.types[p.type]);
    const blocked=shown.filter(p=>p.banned.length).length;
    results = `
      <div class="gen-summary">
        <span class="badge gold">共 ${shown.length} 条</span>
        <span class="badge ok">${IC.check} ${shown.length-blocked} 条可发布</span>
        ${blocked?`<span class="badge warn">${IC.warn} ${blocked} 条待改</span>`:''}
        <span class="muted tiny" style="margin-left:auto">来源：知识库全量注入 · 违禁词表已校验</span>
      </div>
      <div class="results-grid">${shown.map(p=>postCard(p)).join("")}</div>`;
  }

  document.getElementById("app").innerHTML=`
    <div class="frame v-b">
      ${topbar()}
      <div class="body">
        ${side}
        <div class="main scroll">
          <div class="step">
            <div class="step-h"><span class="no">1</span><b>选择 Skill</b></div>
            <div class="skill-grid">${skillGrid}</div>
          </div>
          <div class="step">
            <div class="step-h"><span class="no">2</span><b>配置参数</b></div>
            <div class="form-grid">
              <div><label class="field-lbl">内容类型（可多选）</label>
                <div class="checks">${typeCheck("persona","人设")}${typeCheck("seed","种草")}${typeCheck("camp","活动")}</div></div>
              <div><label class="field-lbl">生成数量</label>
                <div class="stepper"><button data-count="-1">−</button><b>${b.count}</b><button data-count="1">+</button></div></div>
              <div><label class="field-lbl">关联活动</label>
                <select class="inp"><option>七夕焕肤季（满1000减200）</option><option>无</option></select></div>
              <div><label class="field-lbl">主推 Offering</label>
                <select class="inp"><option>深层清洁护理</option><option>水光焕肤</option><option>抗初老紧致</option></select></div>
              <div style="grid-column:1/-1"><label class="field-lbl">语气</label>
                <div class="seg"><button class="on">亲和专业</button><button>活泼种草</button><button>高级简约</button></div></div>
            </div>
            <div style="margin-top:16px"><button class="btn primary big" id="b-gen">${IC.wand} 生成内容</button></div>
          </div>
          <div class="step">
            <div class="step-h"><span class="no">3</span><b>生成结果</b></div>
            ${results}
          </div>
        </div>
      </div>
    </div>`;

  document.querySelectorAll("[data-skill]").forEach(el=>el.onclick=()=>{S.b.skill=el.dataset.skill; renderB();});
  document.querySelectorAll("[data-type]").forEach(el=>el.onclick=()=>{S.b.types[el.dataset.type]=!S.b.types[el.dataset.type]; renderB();});
  document.querySelectorAll("[data-count]").forEach(el=>el.onclick=()=>{S.b.count=Math.max(1,Math.min(5,S.b.count+ +el.dataset.count)); renderB();});
  document.getElementById("b-gen").onclick=()=>{
    if(!S.b.posts) S.b.posts=seedPosts();
    S.b.stage="loading"; renderB();
    setTimeout(()=>{S.b.stage="done"; renderB();},900);
  };
  wireCards();
}

/* =========================================================
   VARIANT C — 混合式
   ========================================================= */
function renderC(){
  const c=S.c;
  const ctxChips = CTX.map((t,i)=>`
    <span class="ctx-chip"><span class="dot"></span>${t}<button class="ex" title="移除">×</button></span>`).join("")
    + `<span class="chip ghost">+ 添加资料</span>`;

  const hero = `
    <div class="gen-hero">
      <div style="font-size:26px">✨</div>
      <div class="t"><b>生成今天的朋友圈</b><br><span>已锁定上面的知识库上下文，一键出 3 条（人设 / 种草 / 活动）</span></div>
      <button class="btn primary big" id="c-gen">${c.stage==="done"?"重新生成":"一键生成 · 3 条"}</button>
    </div>`;

  let stack="";
  if(c.stage==="loading"){
    stack = `<div class="stack">${[0,1,2].map(()=>`<div class="shimmer" style="height:200px"></div>`).join("")}</div>`;
  }else if(c.stage==="done"){
    stack = `<div class="stack">${c.posts.map(p=>{
      const open = c.openRefine===p.id;
      return `<div class="${open?'refine-open':''}">${postCard(p,{refine:true})}</div>`;
    }).join("")}</div>`;
  }

  document.getElementById("app").innerHTML=`
    <div class="frame v-c">
      ${topbar(`<span class="pill">🗂️ 知识库 92%</span>`)}
      <div class="scroll" style="flex:1"><div class="wrap">
        <div class="ctxbar">
          <div class="top"><b>本次参考的知识库上下文</b><span class="tiny muted">看得见 · 可增减 · 生成有据可循</span></div>
          <div class="ctx-chips">${ctxChips}</div>
          <div class="preset-row">
            <span class="tiny muted">场景预设：</span>
            <span class="chip solid">📱 朋友圈日更</span>
            <span class="chip">💌 会员触达</span>
            <span class="chip">👯 社群运营</span>
          </div>
        </div>
        ${hero}
        ${stack || `<div class="empty">点上方「一键生成」，结果会出现在这里，每条都能直接「聊着改」。</div>`}
      </div></div>
    </div>`;

  document.getElementById("c-gen").onclick=()=>{
    S.c.posts=seedPosts(); S.c.stage="loading"; S.c.openRefine=null; renderC();
    setTimeout(()=>{S.c.stage="done"; renderC();},900);
  };
  // per-card refine
  document.querySelectorAll("[data-refine-send]").forEach(el=>el.onclick=()=>cRefine(el.dataset.refineSend));
  document.querySelectorAll("[data-refine-input]").forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter") cRefine(el.dataset.refineInput);}));
  document.querySelectorAll("[data-rq]").forEach(el=>el.onclick=()=>{const[id]=el.dataset.rq.split("|"); cRefine(id);});
  wireCards();
}
function cRefine(id){
  const card=document.querySelector(`[data-card="${id}"]`);
  if(card){ card.style.opacity=".5"; }
  S.c.openRefine=id;
  setTimeout(()=>{ renderC(); const el=document.querySelector(`[data-card="${id}"]`); if(el){el.scrollIntoView({block:"center",behavior:"smooth"});} },700);
}

/* =========================================================
   卡片内共享交互（复制 / 合规改写 / 换图）— 简易假实现
   ========================================================= */
function wireCards(){
  document.querySelectorAll("[data-rewrite]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.rewrite;
    [S.a.posts,S.b.posts,S.c.posts].forEach(arr=>{ if(!arr)return; const p=arr.find(x=>x.id===id);
      if(p){p.body=p.compliant; p.banned=[]; p.sources=p.sources.filter(s=>!s.includes("违禁词"));}});
    reRender();
  });
  document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=()=>{
    const old=el.innerHTML; el.innerHTML=`${IC.check} 已复制`; setTimeout(()=>el.innerHTML=old,1200);
  });
  document.querySelectorAll("[data-imgs]").forEach(el=>el.onclick=()=>{
    el.innerHTML=`${IC.check} 已换一批`; setTimeout(()=>reRender(),700);
  });
}

/* =========================================================
   路由 + 浮动切换条
   ========================================================= */
function reRender(){
  if(S.variant==="A") renderA();
  else if(S.variant==="B") renderB();
  else renderC();
  renderSwitch();
}
function setVariant(k){
  S.variant=k;
  const u=new URL(location); u.searchParams.set("variant",k); history.replaceState(null,"",u);
  reRender();
}
function renderSwitch(){
  const idx=VARIANTS.findIndex(v=>v.k===S.variant);
  const cur=VARIANTS[idx];
  const dots=VARIANTS.map((v,i)=>`<button class="dot ${i===idx?'on':''}" data-goto="${v.k}"></button>`).join("");
  document.getElementById("switch").innerHTML=`
    <button class="arw" id="prev">‹</button>
    <div class="lbl">${cur.k} — ${cur.name}<small>${cur.desc}</small></div>
    <button class="arw" id="next">›</button>
    <div class="dots">${dots}</div>`;
  document.getElementById("prev").onclick=()=>setVariant(VARIANTS[(idx+2)%3].k);
  document.getElementById("next").onclick=()=>setVariant(VARIANTS[(idx+1)%3].k);
  document.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>setVariant(el.dataset.goto));
}
document.addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||e.target.isContentEditable) return;
  const idx=VARIANTS.findIndex(v=>v.k===S.variant);
  if(e.key==="ArrowLeft") setVariant(VARIANTS[(idx+2)%3].k);
  if(e.key==="ArrowRight") setVariant(VARIANTS[(idx+1)%3].k);
});

reRender();

/* deep-link to a generated state, e.g. ?variant=B&autogen=1 (prototype convenience) */
if(new URLSearchParams(location.search).get("autogen")==="1"){
  if(S.variant==="A") aSend("今日朋友圈日更，来 3 条");
  else if(S.variant==="B"){ if(!S.b.posts) S.b.posts=seedPosts(); S.b.stage="loading"; renderB(); setTimeout(()=>{S.b.stage="done"; renderB();},50); }
  else { S.c.posts=seedPosts(); S.c.stage="done"; renderC(); }
}
</script>
